<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 443 414" width="443" height="414">
  <defs>
    <clipPath id="bounds">
      <rect width="443" height="414"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="443" height="414" fill="#e8e8e8"/>

  <!-- Body / blouse -->
  <ellipse cx="221" cy="500" rx="190" ry="145" fill="#1bd8eb" clip-path="url(#bounds)"/>

  <!-- Neck -->
  <rect x="200" y="272" width="43" height="55" rx="8" fill="#c8a882"/>

  <!-- Collar cutout -->
  <polygon points="221,310 195,335 247,335" fill="#17c4d6"/>

  <!-- Head -->
  <ellipse cx="221" cy="205" rx="75" ry="82" fill="#c8a882"/>

  <!-- Hair body — long, behind head -->
  <ellipse cx="221" cy="185" rx="82" ry="90" fill="#2c1a0e"/>
  <!-- Long side curtains -->
  <ellipse cx="152" cy="240" rx="32" ry="85" fill="#2c1a0e"/>
  <ellipse cx="290" cy="240" rx="32" ry="85" fill="#2c1a0e"/>
  <!-- Hair bottom sweep -->
  <ellipse cx="221" cy="318" rx="92" ry="28" fill="#2c1a0e"/>

  <!-- Face (on top of hair) -->
  <ellipse cx="221" cy="210" rx="65" ry="74" fill="#c8a882"/>

  <!-- Eyebrows -->
  <path d="M185 182 Q196 175 207 182" stroke="#2c1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M235 182 Q246 175 257 182" stroke="#2c1a0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="196" cy="200" rx="10" ry="7" fill="#fff"/>
  <circle cx="196" cy="200" r="5.5" fill="#2c1a0e"/>
  <circle cx="198" cy="198" r="1.5" fill="#fff"/>

  <ellipse cx="246" cy="200" rx="10" ry="7" fill="#fff"/>
  <circle cx="246" cy="200" r="5.5" fill="#2c1a0e"/>
  <circle cx="248" cy="198" r="1.5" fill="#fff"/>

  <!-- Eyelashes (feminine touch) -->
  <path d="M186 193 Q183 189 180 188" stroke="#2c1a0e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M236 193 Q239 189 242 188" stroke="#2c1a0e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M221 215 Q216 228 212 231 Q221 235 230 231 Q226 228 221 215" fill="#b8956e"/>

  <!-- Smile -->
  <path d="M205 248 Q221 260 237 248" stroke="#a07050" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="179" cy="222" rx="14" ry="8" fill="#e8a090" opacity="0.4"/>
  <ellipse cx="263" cy="222" rx="14" ry="8" fill="#e8a090" opacity="0.4"/>

  <!-- Lips -->
  <path d="M207 248 Q221 256 235 248 Q221 244 207 248Z" fill="#c07060"/>
</svg>
